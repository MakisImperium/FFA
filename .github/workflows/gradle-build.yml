# Baut ZernythFFA bei jedem Push und Pull Request auf master
# und stellt die ZernythFFA.jar als Download (Artifact) bereit.

name: Gradle Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload ZernythFFA.jar
      uses: actions/upload-artifact@v4
      with:
        name: ZernythFFA
        path: build/libs/ZernythFFA.jar
        if-no-files-found: error
